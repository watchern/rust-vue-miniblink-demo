[package]
name = "rust-vue-miniblink-demo"
version = "0.1.0"
edition = "2021"
description = "miniblink(Chromium 132) + Vue 3 + Rust 桌面应用 Demo"
build = "build.rs"

[[bin]]
name = "mbvue"
path = "src-rs/main.rs"

[dependencies]
libloading = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"

[dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_SystemInformation",
    "Win32_Graphics_Gdi",
]

[build-dependencies]
# 把 assets/icon.rc 编译成 .res 链接进 exe（Explorer 文件图标 / Alt+Tab）。
# 内部按 $RC_$TARGET → $RC → 注册表 Windows Kits 的顺序找 rc.exe，本机均有。
embed-resource = "3.0.12"

[profile.release]
opt-level = 2
